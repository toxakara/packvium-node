name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["16", "18", "20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == '16'
        run: npm run test:legacy
      - if: matrix.node != '16'
        run: npm test

  package-smoke:
    # Prove the package installs and imports from a clean checkout the way a consumer
    # gets it -- `npm pack` applies the `files` allowlist, so this also catches a file
    # the fallback needs that never made it into the published tarball.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "22"}
      - run: npm pack
      - name: Install the packed tarball into a clean project and import it
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y
          npm install "$GITHUB_WORKSPACE"/packvium-engine-*.tgz
          node --input-type=module -e "
            import { pack, backend } from '@packvium/engine';
            console.log(backend());
            const result = pack({
              items: [{id:'a', quantity:1, dimensions:{length:'10', width:'10', height:'10'}}],
              containers: [{id:'c', inner_dimensions:{length:'20', width:'20', height:'20'}}],
            });
            if (typeof result.status !== 'string') process.exit(1);
          "

  # Fails a pull request that introduces a dependency with a known vulnerability or a
  # licence the project has not accepted. It reads GitHub's dependency graph, so it needs
  # nothing committed here beyond this job -- and on a package with no dependencies its
  # usual answer is "nothing changed", which is the answer we want to keep true.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
